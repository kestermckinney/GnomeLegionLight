stages: [build, publish]

variables:
  FLATPAK_REPO_URL: "https://kestermckinney.gitlab.io/gnomelegionlight/flatpak/"
  DISABLE_ROFILES_FUSE: "1"
  USE_BUILDER_FLATPAK: "0"

# Serialize export and publication jobs.
flatpak-release:
  stage: build
  image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
  resource_group: flatpak-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - bash packaging/gitlab/build-release.sh
  artifacts:
    paths:
      - public/
      - packaging/linux/GnomeLegionLight.flatpak
      - packaging/linux/gnomelegionlight.flatpakrepo
    expire_in: 1 week

publish-release:
  stage: publish
  image: alpine:3.22
  needs: [flatpak-release]
  resource_group: flatpak-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  script:
    - echo "Publishing Flatpak repository to GitLab Pages"
  pages:
    publish: public
    expire_in: never
